    <!-- Straw details in light blue -->
    <path d="M 332 132 L 326 146 L 334 143 L 331 153 L 340 146 L 342 154 L 348 144 Z" fill="#4A8DB7" />
    <path d="M 366 126 L 362 142 L 369 139 L 368 150 L 376 142 L 380 151 L 384 139 L 390 145 L 386 132 Z" fill="#4A8DB7" />
    <path d="M 302 186 L 295 202 L 304 199 L 301 212 L 311 203 L 315 213 L 320 198 Z" fill="#4A8DB7" />
    <path d="M 388 186 L 384 202 L 392 199 L 391 212 L 400 203 L 405 213 L 408 198 Z" fill="#4A8DB7" />
