    <!-- Upper cone -->
    <path d="M 355 110 C 338 128 320 152 308 175 L 315 170 L 318 177 L 325 168 L 330 176 L 338 166 L 344 176 L 352 168 L 358 176 L 365 168 L 372 177 L 380 166 L 386 176 L 394 168 L 402 175 C 390 152 372 128 355 110 Z" fill="#FFFFFF" />
    <!-- Middle/lower straw layers -->
