    <path d="M 355 96 L 343 92 L 348 102 L 338 99 L 344 107 C 318 130 292 168 276 205 L 276 226 L 434 226 L 434 205 C 418 168 392 130 366 107 L 372 99 L 362 102 L 367 92 Z" fill="#4A8DB7" />
