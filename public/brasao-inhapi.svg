    <clipPath id="q1-clip">
      <rect x="69" y="69" width="149" height="184" rx="22" />
    </clipPath>
    <!-- Inner clip for Quadrant 2 -->
    <clipPath id="q2-clip">
      <rect x="280" y="69" width="150" height="184" rx="22" />
    </clipPath>
    <!-- Inner clip for Quadrant 3 -->
    <clipPath id="q3-clip">
      <path d="M 91 317 L 196 317 A 22 22 0 0 1 218 339 L 218 522 C 142 503 69 440 69 339 A 22 22 0 0 1 91 317 Z" />
    </clipPath>
    <!-- Inner clip for Quadrant 4 -->
    <clipPath id="q4-clip">
      <path d="M 302 317 L 408 317 A 22 22 0 0 1 430 339 C 430 440 357 503 280 522 L 280 339 A 22 22 0 0 1 302 317 Z" />
    </clipPath>
  </defs>

  <!-- Q1 Frame (Dark Blue) -->
  <rect x="47" y="47" width="193" height="228" rx="42" fill="#174978" />
  <rect x="69" y="69" width="149" height="184" rx="22" fill="#FFFFFF" />
