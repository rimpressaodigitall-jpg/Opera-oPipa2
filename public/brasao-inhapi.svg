    <path d="M 65 205 L 134 138 C 140 132 148 132 155 138 L 225 202 L 225 260 L 65 260 Z" fill="#174978" />
    <!-- White curved valley path at bottom left of hill -->
    <path d="M 65 220 L 92 195 C 102 220 135 228 168 242 L 185 260 L 65 260 Z" fill="#FFFFFF" />
  </g>

