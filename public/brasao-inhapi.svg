<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 524 624" width="524" height="624">
  <!-- Outer Shield Dark Blue (#174978) -->
  <path d="M 96 0 L 404 0 A 96 96 0 0 1 500 96 L 500 320 C 500 468 394 565 250 600 C 106 565 0 468 0 320 L 0 96 A 96 96 0 0 1 96 0 Z" fill="#174978" />
  
  <!-- Inner Shield White Fill (#FFFFFF) -->
  <path d="M 98 22 L 402 22 A 74 74 0 0 1 478 96 L 478 318 C 478 452 380 542 250 576 C 120 542 22 452 22 318 L 22 96 A 74 74 0 0 1 98 22 Z" fill="#FFFFFF" />

  <!-- ================= QUADRANT 1: TOP LEFT (Serra / Cruz) ================= -->
  <defs>
